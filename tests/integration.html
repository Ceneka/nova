<!DOCTYPE html>
<!--
  Browser integration checks for the drill editor and the ball-preset library.

  Serve the repo root over http (the app uses ES modules, so file:// will not do)
  and open tests/integration.html. The page title becomes PASS(n) or FAIL(n)
  and the results table at the bottom lists every check.

  Headless one-liner:
    python3 -m http.server 8123 &
    google-chrome --headless --disable-gpu --virtual-time-budget=10000 \
      --dump-dom http://127.0.0.1:8123/tests/integration.html | grep -o '<title>[^<]*'
-->
<html lang="en" data-theme="standard">
<head>
    <meta charset="UTF-8">
    <title>PENDING</title>
    <meta name="theme-color" content="#0b1013">
    <link rel="stylesheet" href="../../v2/css/style.css">
</head>
<body>
<div id="editor-modal" class="modal-overlay"><div class="modal">
    <div class="modal-header">
        <div class="header-top"><div class="title-container"><span id="editor-drill-name"></span><span id="editor-drill-edit-icon"></span></div></div>
        <div class="header-actions"><input type="checkbox" id="chk-drill-random"></div>
    </div>
    <div id="editor-body" class="modal-body"></div>
</div></div>
<div id="preset-sheet" class="modal-overlay"><div class="modal"><div id="preset-list"></div></div></div>
<div id="preset-modal" class="modal-overlay"><div class="modal">
    <div id="preset-modal-title"></div><div id="preset-editor-body"></div>
    <button class="btn-delete-preset" onclick="window.deleteEditingPreset()"></button>
</div></div>
<div id="save-as-modal" class="modal-overlay"><div class="modal">
    <input type="text" id="save-name" maxlength="40">
    <div class="mode-switch" id="save-cat-switch">
        <div class="mode-option active"></div><div class="mode-option"></div><div class="mode-option"></div>
    </div>
</div></div>
<!-- Mirrors index.html: the dropdown is INSIDE the header, which is sticky.
     It used to be a sibling of the header inside .container, and because
     .container does not scroll, the menu opened off the top of the screen. -->
<header id="harness-header">
    <div id="theme-menu" class="theme-menu">
        <div class="theme-item" onclick="window.openSettings()">Settings</div>
        <div class="theme-item" onclick="window.openAboutModal()">About</div>
    </div>
</header>
<div id="settings-view" class="settings-view" hidden><div class="settings-shell">
    <header class="settings-header">
        <button class="settings-back" onclick="window.closeSettings()">Drills</button>
        <h1>Settings</h1>
    </header>
    <div class="settings-body" id="settings-body"></div>
</div></div>
<div id="stats-view" class="stats-view" hidden><div class="settings-shell">
    <header class="settings-header">
        <button class="settings-back" data-i18n-attr="aria-label:a11y.backToSettings" onclick="window.closeStatsView()"><span data-i18n="menu.settings">Settings</span></button>
        <h1>Statistics</h1>
    </header>
    <div class="settings-body" id="stats-body"></div>
</div></div>
<div id="preset-file-input" type="file" hidden></div>
<div id="ai-view" class="ai-view" hidden><div class="settings-shell">
    <header class="settings-header">
        <button class="settings-back" onclick="window.closeAiView()"><span data-i18n="ai.back">Drills</span></button>
        <h1 data-i18n="ai.title">AI assistant</h1>
    </header>
    <div class="settings-body" id="ai-body"></div>
</div></div>
<div class="container" id="harness-main"><div class="settings-card"><div id="status-text">Disconnected</div><button id="btn-connect" class="btn-connect">Connect</button></div><div class="footer-row"><button class="stats-link" id="harness-stats-link" onclick="window.openStatsFromDrills()"><span id="stats-display"></span></button></div></div>
<div id="view-ia" class="drill-list hidden"></div>
<div id="toast"></div><div id="log" class="log-box"></div>
<pre id="out"></pre>

<script type="module">
import { initData, currentDrills, userCustomDrills, importCustomDrills, exportCustomDrills } from '../../v2/js/state.js';
import { openEditor, closeEditor, saveDrillChanges, insertPresetIntoDrill } from '../../v2/js/editor.js';
import * as P from '../../v2/js/presets.js';
import { B, normalizeBall, makeBall, freqToBpm } from '../../v2/js/ball.js';
import { asciiSlug, drillKeyName } from '../../v2/js/utils.js';
import { DEFAULT_DRILLS, CATEGORIES } from '../../v2/js/constants.js';
import { bleState, connectDevice, setConnectTimeouts } from '../../v2/js/bluetooth.js';
import { updateDrillButtonStates, renderDrillButtons, moveAiDrillTo, clearIaCategory, deleteAiDrillRow } from '../../v2/js/ui.js';
// Imported for its side effects only. Loading the PWA module on a page that is
// not index.html - no service worker registration is made, but the theme-colour
// observer and the install listeners all attach - is part of what is checked.
import { isOfflineReady } from '../../v2/js/pwa.js';
document.addEventListener('connection-changed', updateDrillButtonStates);
import '../../v2/js/presetUi.js';
import { renderSettings } from '../../v2/js/settingsUi.js';
import '../../v2/js/statsUi.js';
import * as AI from '../../v2/js/aiUi.js';
import * as AIS from '../../v2/js/aiStore.js';
import * as AIT from '../../v2/js/aiTerms.js';
import * as CFG from '../../v2/js/aiConfig.js';
import * as CLI from '../../v2/js/aiClient.js';
import * as AG from '../../v2/js/aiAgent.js';
import * as V from '../../v2/js/aiVoice.js';
import * as S from '../../v2/js/stats.js';
import { t, setLang, getLang, initI18n, detectLang, applyI18n, drillDisplayName, axisLabel, LANGUAGES } from '../../v2/js/i18n.js';
import { en } from '../../v2/js/locales/en.js';
import { es } from '../../v2/js/locales/es.js';

const results = [];
const report = () => {
    const failed = results.filter(r => !r.pass);
    document.title = failed.length ? `FAIL(${failed.length})` : `PASS(${results.length})`;
    document.getElementById('out').textContent =
        results.map(r => `${r.pass ? 'PASS' : 'FAIL'}  ${r.name}${r.pass ? '' : '  -> ' + r.extra}`).join('\n');
};
window.addEventListener('error', e => {
    results.push({ name: 'uncaught: ' + e.message, pass: false, extra: (e.error && e.error.stack) || '' });
    report();
});
window.addEventListener('unhandledrejection', e => {
    results.push({ name: 'rejection: ' + (e.reason && e.reason.message || e.reason), pass: false, extra: (e.reason && e.reason.stack) || '' });
    report();
});
const cut = (s, n = 300) => { s = String(s); return s.length > n ? s.slice(0, n) + `... (+${s.length - n} chars)` : s; };
const ok = (name, cond, extra = '') => results.push({ name, pass: !!cond, extra: cut(extra) });
const eq = (name, a, b) => results.push({ name, pass: JSON.stringify(a) === JSON.stringify(b), extra: `got ${cut(JSON.stringify(a))} want ${cut(JSON.stringify(b))}` });

const groups = () => document.querySelectorAll('#editor-body .ball-group');
const entryBtn = () => document.querySelector('#editor-body .preset-entry');
const chips = () => document.querySelectorAll('#preset-list .preset-card');

try {
initData();

/* ---- the shared drill CSV export is byte-for-byte unchanged ---- */
// Reproduce the pre-refactor expression over the same data and compare.
let expected = "Set;Ball;Name;Speed;Spin;Type;Height;Drop;BPM;Reps\n";
const cats = { basic: 'Basic', combined: 'Combined', complex: 'Complex' };
const fmtLvl = (key, lvl) => `${key.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())} (Lvl ${lvl})`;
for (const cat of ['basic', 'combined', 'complex']) {
    const list = CATEGORIES[cat];
    for (const key of list) {
        const drill = DEFAULT_DRILLS[key];
        for (let lvl = 1; lvl <= 3; lvl++) {
            const seq = drill[lvl];
            if (!seq || !seq.length) continue;
            seq.forEach((stepOptions, si) => stepOptions.forEach(ball => {
                let speed = ball[7], spin = ball[8], type = ball[9];
                if (speed === undefined) {
                    const rev = (() => {
                        const t = ball[0] >= ball[1] ? 'top' : 'back';
                        const base = (ball[0] + ball[1]) / 2;
                        return { speed: Math.round(((base - 970) / 630.5) * 2) / 2,
                                 spin: Math.round((Math.abs(ball[0]-ball[1])/2/342) * 2) / 2, type: t };
                    })();
                    speed = rev.speed; spin = rev.spin; type = rev.type;
                }
                const bpm = Math.round(30 + (ball[4] * 0.6));
                expected += [cats[cat], si+1, fmtLvl(key, lvl), speed, spin, type, ball[2], ball[3], bpm, ball[5]].join(';') + '\n';
            }));
        }
    }
}

// capture what the app actually produces
let captured = null;
const RealBlob = window.Blob;
window.Blob = class extends RealBlob { constructor(parts, opts) { super(parts, opts); captured = parts.join(''); } };
const { exportCustomDrills, importCustomDrills } = await import('../../v2/js/state.js');
try { exportCustomDrills(); } finally { window.Blob = RealBlob; }

const appCsv = captured.split('\n').filter(l => l && !/^A;|^B;|^C;/.test(l)).join('\n') + '\n';
eq('shared drill CSV export unchanged by the refactor', appCsv, expected);

/* ---- drill names are free text; the key and the CSV are the ASCII subset ---- */
// The name field used to refuse anything outside [A-Za-z0-9.\-#[]><+() ], so a
// name with an accent or a comma was rejected with a toast. The app now takes
// the name as typed - accents, commas, emoji - and folds it in exactly two
// places: the storage key, which is interpolated into a [data-key="..."]
// selector, and the Name column of the shared CSV other apps split on ';'.
{
    const WILD = 'Saque Rápido, 🔥 (Rápido)';
    const FOLDED = 'Saque Rapido (Rapido)';
    // Anything a key may carry: it is pasted into a CSS attribute selector and
    // used as an object key, so a quote or a bracket in it would throw.
    const KEYISH = /^cust_[A-C]_[A-Za-z0-9._#\-\[\]><+()_]+_\d+$/;
    const exported = () => {
        let text = null;
        window.Blob = class extends RealBlob { constructor(p, o) { super(p, o); text = p.join(''); } };
        try { exportCustomDrills(); } finally { window.Blob = RealBlob; }
        return text || '';
    };

    const nameInput = document.getElementById('save-name');
    openEditor('push(b)');          // "save as" copies whatever the editor holds
    nameInput.value = WILD;
    window.selectSaveCategory('custom-a', document.querySelector('#save-cat-switch').children[0]);
    window.performSaveAs();

    const saved = userCustomDrills['custom-a'].find(d => d.name === WILD);
    ok('a name with an accent, a comma and an emoji is accepted', !!saved,
       JSON.stringify(userCustomDrills['custom-a'].map(d => d.name)));
    ok('and is stored exactly as typed', saved?.name === WILD, saved?.name);
    eq('the editor shows it exactly as typed', document.getElementById('editor-drill-name').textContent, WILD);
    ok('the storage key is the folded name, not the typed one',
       !!saved?.key.startsWith(`cust_A_Saque_Rapido_(Rapido)_`), saved?.key);
    ok('the key carries nothing a selector or an object key can trip on',
       KEYISH.test(saved?.key || '') && /^[\x20-\x7e]+$/.test(saved?.key || ''), saved?.key);

    // The hazard the key has to survive: ui.js interpolates it into this
    // selector to find the last-played button, and a quote throws a SyntaxError
    // on the next render rather than at the point of the mistake.
    const probe = document.createElement('div');
    probe.style.display = 'none';
    const fake = document.createElement('button');
    fake.className = 'btn-drill';
    fake.dataset.key = saved?.key;
    probe.appendChild(fake);
    document.body.appendChild(probe);
    let resolves = false;
    try { resolves = document.querySelector(`.btn-drill[data-key="${saved?.key}"]`) === fake; } catch (e) { resolves = false; }
    probe.remove();
    ok('the key resolves through the [data-key] selector the highlight uses', resolves, saved?.key);

    const wildRow = exported().split('\n').find(l => l.startsWith('A;') && l.includes('Saque'));
    eq('the shared CSV writes the folded name', wildRow?.split(';')[2], FOLDED);
    eq('and the row still has exactly the ten columns', wildRow?.split(';').length, 10);
    ok('and the row is pure ASCII', /^[\x20-\x7e]*$/.test(wildRow || ''), wildRow);

    const realPrompt = window.prompt;
    window.prompt = () => 'Renombrado, ya 🎾';
    const oldKey = saved.key;       // the rename mutates the same entry object
    try { window.handleRenameDrill(); } finally { window.prompt = realPrompt; }
    const renamed = userCustomDrills['custom-a'].find(d => d.name === 'Renombrado, ya 🎾');
    ok('renaming takes the same characters', !!renamed,
       JSON.stringify(userCustomDrills['custom-a'].map(d => d.name)));
    ok('and re-keys in ASCII', KEYISH.test(renamed?.key || ''), renamed?.key);
    ok('the old key is gone and the drill moved with it',
       !currentDrills[oldKey] && !!currentDrills[renamed?.key], oldKey);

    nameInput.value = '🔥';
    window.performSaveAs();
    const emojiOnly = userCustomDrills['custom-a'].find(d => d.name === '🔥');
    ok('a name with no ASCII in it at all still saves', !!emojiOnly,
       JSON.stringify(userCustomDrills['custom-a'].map(d => d.name)));
    ok('and still gets a usable key', /^cust_A_drill_\d+$/.test(emojiOnly?.key || ''), emojiOnly?.key);
    const emojiNames = exported().split('\n').filter(l => l.startsWith('A;')).map(l => l.split(';')[2]);
    ok('and exports a Name cell rather than an empty one', emojiNames.includes('Drill'), emojiNames.join(' | '));

    // A hand-made file from another app, not one of ours: the name is taken as
    // the file wrote it, and only the key is folded.
    ok('the importer takes a row with accents and emoji',
       importCustomDrills('Set;Ball;Name;Speed;Spin;Type;Height;Drop;BPM;Reps\n'
                        + 'B;1;imported, ñ 🔥;5;2;top;50;0;60;2\n'));
    const imported = userCustomDrills['custom-b'].find(d => d.name === 'imported, ñ 🔥');
    ok('and keeps that name exactly as the file said it', !!imported,
       JSON.stringify(userCustomDrills['custom-b'].map(d => d.name)));
    ok('while still keying it in ASCII', /^cust_B_[A-Za-z0-9._#\-\[\]><+()_]+$/.test(imported?.key || ''), imported?.key);
    ok('and the imported row is playable', !!currentDrills[imported?.key]?.[1]?.length);
}

// The fold itself, including the property the whole compatibility argument
// rests on: a name the old field accepted has to fold to itself, or every
// existing export would change under a user who never touched their drills.
eq('a name the old field accepted folds to itself',
   asciiSlug('Push(B) #2 [L] + (R)'), 'Push(B) #2 [L] + (R)');
eq('accents are dropped, not turned into gaps', asciiSlug('Saque Rápido'), 'Saque Rapido');
eq('a letter with its own stroke transliterates', asciiSlug('Straße'), 'Strasse');
eq('emoji and commas collapse to single spaces', asciiSlug('🔥, a, b'), 'a b');
eq('an empty fold takes the fallback the caller passed', asciiSlug('🔥', 'Drill'), 'Drill');
eq('the key half joins the words with underscores', drillKeyName('Saque Rápido, 🔥'), 'Saque_Rapido');

/* ---- 0. the preset entry point is the first thing in the editor ---- */
openEditor('push(b)');
ok('a labelled "add from preset" button is rendered', !!entryBtn());
eq('it reads "Add from preset"', entryBtn()?.textContent.trim(), 'Add from preset');
ok('it is the first element in the editor body', document.getElementById('editor-body').firstElementChild === entryBtn());
ok('it is big enough to tap', entryBtn().getBoundingClientRect().height >= 40,
   Math.round(entryBtn().getBoundingClientRect().height) + 'px');
ok('it is full width', entryBtn().getBoundingClientRect().width >
   document.querySelector('#editor-body .ball-group').getBoundingClientRect().width * 0.8);
entryBtn().click();
ok('tapping it opens the preset sheet', document.getElementById('preset-sheet').classList.contains('open'));
ok('the sheet lists the presets', document.querySelectorAll('#preset-list .preset-card').length > 0);
window.closePresetSheet();

/* ---- 1. stock library ---- */
eq('library seeded from defaults', P.getPresets().length, P.DEFAULT_PRESETS.length);

/* ---- 2. insert a full sequence (3 placements x 3 depths) ---- */
openEditor('push(b)');
const before = groups().length;
const added = insertPresetIntoDrill('preset_short_under', 'sequence');
eq('sequence added 9 steps', added, 9);
eq('editor grew by 9 groups', groups().length - before, 9);

const drops = [...document.querySelectorAll('#editor-body .ball-group')]
    .slice(-9)
    .map(g => Number(g.querySelectorAll('.editor-field input')[4].value));
eq('last 9 steps carry BH/Center/FH per depth', drops, [-5,0,5,-5,0,5,-5,0,5]);

const heights = [...document.querySelectorAll('#editor-body .ball-group')]
    .slice(-9)
    .map(g => Number(g.querySelectorAll('.editor-field input')[3].value));
eq('depths are anchored on the preset height (30)', heights, [10,10,10,30,30,30,50,50,50]);

/* ---- 3. variants mode = one step, many variants ---- */
const nBefore = groups().length;
const vAdded = insertPresetIntoDrill('preset_short_under', 'variants');
eq('variants added 1 step', vAdded, 1);
eq('variants added 1 group', groups().length - nBefore, 1);
eq('that group shows 9 variant cards', groups()[groups().length-1].querySelectorAll('.option-card').length, 9);
ok('variant label rendered', /Variant 1/.test(groups()[groups().length-1].textContent));

/* ---- 4. single mode ---- */
const sAdded = insertPresetIntoDrill('preset_safe_push', 'single');
eq('single added 1 step', sAdded, 1);
eq('single is one variant', groups()[groups().length-1].querySelectorAll('.option-card').length, 1);

/* ---- 5. the 20-step cap ---- */
eq('push(b) started at 1 step', groups().length, 12);
eq('sequence of 9 no longer fits in 8 slots', insertPresetIntoDrill('preset_short_under', 'sequence'), -1);
eq('nothing was added', groups().length, 12);
eq('a 1-ball preset still fits', insertPresetIntoDrill('preset_safe_push', 'single'), 1);
eq('now 13 steps', groups().length, 13);

// fill the drill to the cap and confirm it refuses to overflow
while (insertPresetIntoDrill('preset_safe_push', 'single') > 0) { /* fill */ }
eq('filled to the 20-step cap', groups().length, 20);
eq('cap is enforced', insertPresetIntoDrill('preset_safe_push', 'single'), -1);
eq('still 20 after refusal', groups().length, 20);

saveDrillChanges();
eq('push(b) saved with 20 steps', currentDrills['push(b)'][1].length, 20);

/* ---- 6. sheet disables actions when the drill is full ---- */
window.openPresetSheet();
ok('sheet rendered a card per preset', chips().length === P.getPresets().length, chips().length);
ok('all add buttons disabled at cap',
    [...document.querySelectorAll('#preset-list .btn-preset-add')].every(b => b.disabled));

// ...and re-enable once there is room again
openEditor('push(f)');
window.openPresetSheet();
ok('add buttons enabled when there is room',
    [...document.querySelectorAll('#preset-list .btn-preset-add')].every(b => !b.disabled));
window.closePresetSheet();

/* ---- 8. factory defaults still describe the same physics ---- */
// the shipped push(b) ball is stored as raw RPMs; reverse-calc must be stable
const legacy = normalizeBall([1547, 2915, 50, -5, 10, 1, 1]);
eq('legacy push(b) -> speed 2', legacy[B.SPEED], 2);
eq('legacy push(b) -> spin 2', legacy[B.SPIN], 2);
eq('legacy push(b) -> back', legacy[B.TYPE], 'back');
eq('legacy push(b) -> 36 bpm', freqToBpm(legacy[B.FREQ]), 36);

/* ---- 9. makeBall agrees with the stored editor values ---- */
const ball = makeBall({ speed: 4, spin: 1.5, type: 'top', height: 30, drop: -5, bpm: 60, reps: 1 });
eq('makeBall drop', ball[B.DROP], -5);
eq('makeBall speed', ball[B.SPEED], 4);
eq('makeBall active', ball[B.ACTIVE], 1);

/* ---- 10. create a preset from a ball, then find it again ---- */
openEditor('push(f)');
window.handleSaveBallAsPreset(0, 0);
ok('preset editor opened from a ball', document.getElementById('preset-modal').classList.contains('open'));
eq('seeded name field', document.getElementById('pf-name').value, 'New preset');
// push(f) is [1547,2915,50,+5,10,1] -> speed 2, spin 2, back, height 50, drop +5
const pfInputs = [...document.querySelectorAll('#preset-editor-body .editor-field input')];
eq('seeded speed from the ball', pfInputs[0].value, '2');
eq('seeded spin from the ball', pfInputs[1].value, '2');
eq('seeded height from the ball', pfInputs[2].value, '50');
eq('seeded drop from the ball', pfInputs[3].value, '5');

const nameEl = document.getElementById('pf-name');
nameEl.value = 'My serve';
nameEl.dispatchEvent(new Event('input', { bubbles: true }));
window.handlePresetAxisStandard('placement');
window.savePresetEditor();
const mine = P.getPresets().find(p => p.name === 'My serve');
ok('preset was created', !!mine, JSON.stringify(P.getPresets().map(p => p.name)));
ok('name did not fall back to the default', !P.getPresets().some(p => p.name === 'New preset'));
eq('it has 3 placements', mine.placements.length, 3);
eq('and no depth axis', mine.depths.length, 0);
ok('it is not marked built-in', mine.builtIn === false);
eq('survives a reload from storage', JSON.parse(localStorage.getItem('nova_ball_presets')).filter(p => p.name === 'My serve').length, 1);

/* ---- 11. preset file round-trip ---- */
const json = P.serializePresetsToJSON();
const csv = P.serializePresetsToCSV();
eq('json round-trip', P.parsePresetsJSON(json).length, P.getPresets().length);
eq('csv round-trip', P.parsePresetsAuto(csv).length, P.getPresets().length);
ok('csv has the documented header', csv.startsWith('Name;Id;Speed;Spin;Type;BPM;Reps;Scatter;Height;Drop;Axis;Label;Value'));

/* ---- 12. the shared drill importer still works, format untouched ---- */
// Verbatim shape of nova_drills_v2_example.csv (header names the Freq column,
// older files call it BPM - the importer tolerates both).
const SHARED_CSV = [
    'Set;Ball;Name;Speed;Spin;Type;Height;Drop;BPM;Reps',
    'A;1;Drill A1;7.5;5;back;50;-5;60;1',
    'A;1;Drill A1;7.5;5;back;50;5;60;1',
    'A;2;Drill A1;7.5;5;back;50;-5;60;1',
    'A;1;Drill A2;7.5;5;back;50;-5;10;1',
    'B;1;Drill B1;7.5;5;back;50;-5;36;1',
    'B;1;Drill B1;7.5;5;back;50;5;36;1',
    '',
].join('\n');

ok('shared CSV import accepted', importCustomDrills(SHARED_CSV) === true);
const a1 = currentDrills[userCustomDrills['custom-a'].find(d => d.name === 'Drill A1')?.key];
ok('Drill A1 imported', !!a1);
eq('Drill A1 has 2 steps', a1?.[1]?.length, 2);
eq('ball 1 is backspin 7.5/5', [a1?.[1]?.[0]?.[0][7], a1?.[1]?.[0]?.[0][8], a1?.[1]?.[0]?.[0][9]], [7.5, 5, 'back']);
eq('an in-range bpm round-trips exactly', freqToBpm(a1?.[1]?.[0]?.[0][4]), 60);
eq('variants share a ball number', a1?.[1]?.[0]?.length, 2);

const b1 = currentDrills[userCustomDrills['custom-b'].find(d => d.name === 'Drill B1')?.key];
eq('a second in-range bpm round-trips exactly', freqToBpm(b1?.[1]?.[0]?.[0][4]), 36);
eq('Drill B1 has 1 step', b1?.[1]?.length, 1);
eq('Drill B1 ball has 2 variants', b1?.[1]?.[0]?.length, 2);
// an out-of-range bpm is the one place the importer now normalises, matching
// what the editor already did on save: 10 bpm is below the table's 30 bpm floor
const a2 = currentDrills[userCustomDrills['custom-a'].find(d => d.name === 'Drill A2')?.key];
eq('an out-of-range bpm is clamped to the 30 floor', freqToBpm(a2?.[1]?.[0]?.[0][4]), 30);

/* ---- 13. preset-inserted balls survive a save/normalize round trip ---- */
openEditor('loop(b)');
insertPresetIntoDrill('preset_fast_drive', 'variants');

// An <svg> with no fill/stroke rule renders black-filled by default, which is
// how a star icon and a multi-subpath trash glyph both looked "broken".

    const cs = getComputedStyle(sv);
    const fill = cs.fill, stroke = cs.stroke;
    const hasFill = fill && fill !== 'none' && !/rgba\(0, 0, 0, 0\)/.test(fill);
    const hasStroke = stroke && stroke !== 'none' && !/rgba\(0, 0, 0, 0\)/.test(stroke);
    const where = (sv.parentElement.className || sv.parentElement.tagName) + ' :: ' + sv.innerHTML.slice(0, 34);
    if (!hasFill && !hasStroke) unpainted.push(where);
    // default fill is black; an icon relying on it is a black blob
    else if (hasFill && /^rgb\(0, 0, 0\)$/.test(fill) && sv.querySelectorAll('path').length > 1) blobbed.push(where);
});

/* ---- 17. accessibility of the new UI (WCAG AA, all four themes) ---- */
const parseC = (c) => { const m = c.match(/[\d.]+/g); return m ? m.map(Number) : null; };
const relLum = ([r, g, b]) => { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); };
const contrast = (a, b) => { const L1 = relLum(a), L2 = relLum(b); return (Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05); };
function backdrop(el) {
    let n = el;
    while (n && n !== document.documentElement) {
        const p = parseC(getComputedStyle(n).backgroundColor);
        if (p && (p[3] === undefined || p[3] > 0.85)) return p.slice(0, 3);
        n = n.parentElement;
    }
    return [255, 255, 255];
}
const hasOwnText = (el) => Array.from(el.childNodes).some(n => n.nodeType === 3 && n.textContent.trim());

const oldTheme = document.documentElement.getAttribute('data-theme');
const contrastFails = [];
for (const theme of ['standard', 'ocean', 'forest', 'night']) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('#preset-list *, #preset-editor-body *').forEach(el => {
        if (!hasOwnText(el)) return;
        const cs = getComputedStyle(el);
        // skip the pre-existing editor chrome this screen merely reuses
        if (el.classList.contains('range-hint') || el.tagName === 'LABEL' ||
            el.classList.contains('spin-label') || el.classList.contains('sc-opt')) return;
        // WCAG 1.4.3 exempts inactive controls, and a disabled preset button is
        // deliberately dimmed to --text-light.
        if (el.disabled || el.closest('[disabled]')) return;
        const fg = parseC(cs.color);
        if (!fg) return;
        const r = contrast(fg.slice(0, 3), backdrop(el));
        const px = parseFloat(cs.fontSize);
        const need = (px >= 24 || (px >= 18.66 && parseInt(cs.fontWeight) >= 700)) ? 3 : 4.5;
        if (r < need) contrastFails.push(`[${theme}] ${el.className || el.tagName} "${el.textContent.trim().slice(0, 18)}" ${r.toFixed(2)}:1`);
    });
}
document.documentElement.setAttribute('data-theme', oldTheme || 'standard');
ok('every new preset-UI label meets WCAG AA in all four themes', contrastFails.length === 0,
   contrastFails.slice(0, 6).join(' | '));

// --- the network harness ----------------------------------------------------
const sseChunk = (o) => `data: ${JSON.stringify(o)}\n\n`;
const SSE_DONE = 'data: [DONE]\n\n';

function streamOf(chunks, { status = 200 } = {}) {
    return {
        ok: status >= 200 && status < 300,
        status,
        body: {
            getReader: () => {
                let i = 0;
                return {
                    read: async () => (i < chunks.length
                        ? { done: false, value: new TextEncoder().encode(chunks[i++]) }
                        : { done: true }),
                    cancel: async () => {}
                };
            }
        },
        text: async () => chunks.join('')
    };
}

/** One tool-call turn followed by a spoken answer, as a real stream. */
const composeThenAnswer = (name, args) => streamOf([
    sseChunk({ choices: [{ delta: { tool_calls: [{ index: 0, id: 'c1', function: { name, arguments: JSON.stringify(args) } }] }, finish_reason: 'tool_calls' }] }),
    sseChunk({ choices: [{ delta: { content: 'I used a saved push.' }, finish_reason: 'stop' }] }),
    SSE_DONE
]);

let lastRequest = null;
window.fetch = async (url, init) => {
    lastRequest = { url, init, body: JSON.parse(init.body) };
    return composeThenAnswer('compose_drill', {
        name: 'Model drill', steps: [{ role: 'push', side: 'bh' }]
    });
};

// A regression that is invisible until you scroll: the dropdown was a child of
// .container, which does not scroll, so `top: 58px` meant 58px from the top
// of the DOCUMENT. The hamburger stayed on screen (it is in the sticky header),
// so tapping it appeared to do nothing. Three ways to catch it, cheapest
// first: the real markup, the relationship, and the geometry.
{
    // Fetched inline rather than through the section-21 `text` helper, which
    // is declared further down this block and would be in its dead zone here.
    const fetchText = async (p) => (await fetch(new URL('../../v2/' + p, location.href))).text();
    const realHtml = await fetchText('index.html');

    ok('index.html puts the dropdown inside the header', (() => {
        const header = /<header[^>]*>([\s\S]*?)<\/header>/.exec(realHtml);
        return !!header && /id="theme-menu"/.test(header[1]);
    })(), 'the first <header> in the real file must contain #theme-menu');

    ok('and the header is sticky in the stylesheet',
       /position:\s*sticky/.test(await fetchText('css/style.css')));

    // The title and the two floating controls have to be able to coexist. They
    // overlapped by 7px on a 375px phone until the name gained a short form,
    // so the markup for BOTH forms is asserted here - cheap, and it cannot
    // rot. The geometry itself is checked by tools/check-app.mjs, which can
    // change the viewport.
    const brand = /<h1 class="brand">([\s\S]*?)<\/h1>/.exec(await fetchText('index.html'));
    ok('the title has a long and a short form', !!brand
        && /brand-full/.test(brand[1]) && /brand-short/.test(brand[1]));
    ok('and only the short one is translated away, both are real i18n keys', (() => {
        if (!brand) return false;
        return /data-i18n="app\.title"/.test(brand[1]) && /data-i18n="app\.shortTitle"/.test(brand[1]);
    })());
    ok('with the short form hidden until a narrow breakpoint',
       /\.brand-short\s*\{\s*display:\s*none/.test(await fetchText('css/style.css')));

    const menu = document.getElementById('theme-menu');
    const header = document.getElementById('harness-header');
    header.style.position = 'sticky';
    header.style.top = '0';

    ok('its containing block is the header, not the page', menu.offsetParent === header,
       menu.offsetParent?.tagName || 'none');
    ok('which is sticky', getComputedStyle(header).position === 'sticky');

    // Geometry, without needing a page tall enough to scroll: move the
    // containing block and the menu must move with it.
    const before = menu.getBoundingClientRect().top;
    header.style.transform = 'translateY(-40px)';
    const after = menu.getBoundingClientRect().top;
    header.style.transform = '';
    ok('and the menu follows the header, not the document',
       Math.round(before - after) === 40, `moved ${Math.round(before - after)}px with the header`);
}

/* ---- 20. connecting to the robot ---- */


// The regression this guards: the app used to add the notify listener AFTER
// awaiting startNotifications(). The robot pushes its serial the moment
// notifications switch on, so that packet was dropped and the handshake could
// never start - the UI just sat there looking disconnected until you clicked
// Connect a second time.
const SERIAL_TEXT = 'NOVASPRO0001ABCDEF123456';
const btnConnect = document.getElementById('btn-connect');
const statusText = document.getElementById('status-text');

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function installFakeRobot({ replyToHandshake = true, serialOnSubscribe = true,
                            dropWriteChannel = false, gattError = null,
                            pickerError = null } = {}) {
    const notifyHandlers = [];
    const fire = (bytes) => notifyHandlers.forEach(h => h({ target: { value: new DataView(bytes) } }));

    const notifyChar = {
        uuid: '02f00000-0000-0000-0000-00000000ff02',
        addEventListener: (t, fn) => { if (t === 'characteristicvaluechanged') notifyHandlers.push(fn); },
        // Fires the serial BEFORE resolving, which is the race the old code lost.
        startNotifications: () => new Promise(resolve => {
            setTimeout(() => {
                if (serialOnSubscribe) fire(new TextEncoder().encode(SERIAL_TEXT).buffer);
                resolve(true);
            }, 0);
        })
    };
    const writeChar = {
        uuid: '02f00000-0000-0000-0000-00000000ff01',
        addEventListener: () => {},
        writeValue: async () => {
            if (replyToHandshake) setTimeout(() => fire(new Uint8Array([0]).buffer), 0);
        }
    };

    const disconnectHandlers = [];
    const chars = dropWriteChannel ? [notifyChar] : [writeChar, notifyChar];
    const device = {
        addEventListener: (t, fn) => { if (t === 'gattserverdisconnected') disconnectHandlers.push(fn); },
        gatt: {
            connected: false,
            connect: async () => {
                if (gattError) throw new Error(gattError);
                device.gatt.connected = true;
                return { getPrimaryService: async () => ({ getCharacteristics: async () => chars }) };
            },
            disconnect: () => { device.gatt.connected = false; disconnectHandlers.forEach(f => f()); }
        }
    };

    Object.defineProperty(navigator, 'bluetooth', {
        configurable: true,
        value: {
            requestDevice: async () => { if (pickerError) throw pickerError; return device; }

    });
    return device;
}

/* --- the icons are real, and are the sizes they claim to be --- */
// The onload promise, not img.decode(): decode() and createImageBitmap() both
// never settle in this headless build, which would hang the whole page rather
// than fail a check.
const decode = (src) => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`could not load ${src}`));
    img.src = new URL(src, root).href;
});
const pixels = (img) => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    return { ctx, w: c.width, h: c.height, data: ctx.getImageData(0, 0, c.width, c.height).data };
};
// A canvas reports an image as opaque only if it really is: a "purpose: any"
// icon with transparent corners gets rounded a second time by the launcher and
// ends up visibly smaller than it should.
const opaqueAt = (px, x, y) => px.data[(y * px.w + x) * 4 + 3] === 255;

ok('it includes a maskable icon for Android launchers',
   manifest.icons.some(i => (i.purpose || '').split(/\s+/).includes('maskable')),
   manifest.icons.map(i => `${i.src}:${i.purpose}`).join(' '));

for (const icon of manifest.icons) {
    let img;
    try {
        img = await decode(icon.src);
    } catch (e) {
        ok(`icon ${icon.src} loads`, false, e.message);
        continue;
    }
    const real = `${img.naturalWidth}x${img.naturalHeight}`;
    ok(`icon ${icon.sizes} is really ${icon.sizes}`, real === icon.sizes, real);

    const px = pixels(img);
    ok(`icon ${icon.sizes} is full-bleed`,
       opaqueAt(px, 0, 0) && opaqueAt(px, px.w - 1, px.h - 1));
}

ok('iOS has its own home screen icon', !!(await decode('icons/apple-touch-icon.png')));
ok('the browser tab has an icon', !!(await decode('icons/favicon-32.png')));

/* --- the maskable icon survives the launcher's crop --- */
// Android may crop 10% off every edge and some launchers take 20% off the
// sides, so the artwork has to stay inside the middle 80% - a circle of radius
// 0.4 * width, which is 0.8 of the half-width.
//
// Measured by BRIGHTNESS, not by hue. The old test skipped any pixel whose
// blue or green was low, which was a way of saying "not the orange ball" and
// only held while the ball was the one warm thing on the icon: redraw the mark
// in the same family with a different accent and its warm half gets counted as
// background, and the check goes on passing while measuring almost nothing.
// The ground here is a dark gradient with a mint lamp behind the mark, and its
// brightest pixel is ~50; the dimmest stroke, the far table edge at half
// opacity, is ~130. 110 sits between the two, and the result does not depend on
// it: 60, 80, 110 and 140 all measure the same extent, because what binds is
// the opaque table bar either way.
const GROUND_MAX = 110;
const artworkExtent = async (src) => {
    const px = pixels(await decode(src));
    let worst = 0, at = '';
    for (let y = 0; y < px.h; y += 2) {
        for (let x = 0; x < px.w; x += 2) {
            const i = (y * px.w + x) * 4;
            if (Math.max(px.data[i], px.data[i + 1], px.data[i + 2]) < GROUND_MAX) continue;
            const dist = Math.hypot(x - px.w / 2, y - px.h / 2) / (px.w / 2);
            if (dist > worst) { worst = dist; at = `${x},${y}`; }
        }
    }
    return { worst, at };
};
const safe = await artworkExtent('icons/maskable-512.png');
ok('the maskable icon keeps its artwork inside the safe zone',
   safe.worst <= 0.8, `reaches ${(safe.worst * 100).toFixed(1)}% of the radius, limit 80%, at ${safe.at}`);

/* --- the service worker --- */
const swSource = await text('sw.js');

// A real registration cannot be tested here. Under --virtual-time-budget a
// *successful* service worker registration never settles - the page hangs
// instead of reporting - while a failed one rejects immediately, so a
// registration test would break the suite rather than check anything. (It is
// the virtual clock, not headless: driven over CDP against a real browser the
// same worker activates, precaches 27 files, and the app then boots with the
// network switched off.) So run the real sw.js against a fake CacheStorage
// and drive its own event handlers - that is the half that can actually rot.
function loadWorker({ online = true } = {}) {
    const listeners = {};
    const stores = new Map();
    const calls = { claimed: 0, skippedWaiting: 0, network: [] };

    // Relative precache paths have to resolve against the worker's own URL,
    // which in a real worker is sw.js at the site root - not against the test
    // page, which would put './' in /tests/.
    class WorkerRequest extends Request {
        constructor(input, init) {
            super(typeof input === 'string' ? new URL(input, root).href : input, init);
        }
    }
    const keyOf = (r) => (typeof r === 'string' ? new URL(r, root) : new URL(r.url)).href;

    const fakeFetch = async (request, init) => {
        const url = keyOf(request);
        calls.network.push(url);
        if (!online) throw new TypeError('Failed to fetch');
        return globalThis.fetch(url, init);
    };

    const fakeCaches = {
        async open(name) {
            if (!stores.has(name)) stores.set(name, new Map());
            const entries = stores.get(name);
            return {
                // Real addAll is all-or-nothing, and the worker relies on that.
                async addAll(requests) {
                    const staged = [];
                    for (const r of requests) {
                        const res = await fakeFetch(r);
                        if (!res.ok) throw new Error(`addAll failed on ${keyOf(r)}: ${res.status}`);
                        staged.push([keyOf(r), res]);
                    }
                    staged.forEach(([k, v]) => entries.set(k, v));
                },
                async match(request) { return entries.get(keyOf(request)); },
                async put(request, response) { entries.set(keyOf(request), response); },
                async keys() { return [...entries.keys()].map(url => new WorkerRequest(url)); }
            };
        },
        async keys() { return [...stores.keys()]; },
        async delete(name) { return stores.delete(name); }
    };

    const fakeSelf = {
        location: new URL(root.href),
        addEventListener: (type, fn) => { (listeners[type] ||= []).push(fn); },
        skipWaiting: async () => { calls.skippedWaiting++; },
        clients: { claim: async () => { calls.claimed++; } }
    };

    // eslint-disable-next-line no-new-func
    new Function('self', 'caches', 'Request', 'fetch', swSource)
        (fakeSelf, fakeCaches, WorkerRequest, fakeFetch);

    // The worker only ever reacts through waitUntil/respondWith, so give it
    // the same shape the browser would and hand the resulting promise back to
    // the caller. Returning it (rather than awaiting it here) is what lets a
    // test assert that an install *failed*.
    const dispatch = (type, event) => {
        let settled = null;
        const e = event || {};
        e.respondWith = (p) => { settled = p; };
        e.waitUntil = (p) => { settled = p; };
        for (const fn of listeners[type] || []) fn(e);
        return settled;
    };

    // A navigation request cannot be built with `new Request` - "navigate" is
    // reserved for the browser - so the handler gets the same plain shape it
    // would see for real.
    const navRequest = (path) => ({ method: 'GET', mode: 'navigate', url: new URL(path, root).href });
    const getRequest = (path) => new WorkerRequest(path);

    return { dispatch, navRequest, getRequest, stores, calls };
}

ok('install takes over at once rather than waiting for every tab to close',

// to `/index.html` are different cache keys, and the fallback takes whichever
// it finds.
ok('the app shell is cached under both of its URLs',
   cached.has(root.href) && cached.has(new URL('index.html', root).href),
   [...cached].filter(u => !u.includes('/js/')).map(u => u.replace(root.href, '')).join(' '));

   cached.has(new URL('manifest.webmanifest', root).href) && cached.has(new URL('css/style.css', root).href));
ok('the converter tool is cached, since the manifest offers it as a shortcut',
   cached.has(new URL('converter.html', root).href));

/* --- the canary: every module the app loads is precached --- */
// This is the check that matters most. A module missing from the precache list
// installs perfectly and then fails the first time the phone loses signal,
// which is the one situation the app exists for. Walking the real import graph
// is what makes it impossible to forget: adding js/foo.js and importing it
// anywhere turns this red.
const queued = [...(await text('index.html')).matchAll(/(?:src|href)="([^"]+)"/g)]
    .map(m => m[1])
    .filter(u => !/^(?:https?:)?\/\/|#|data:|mailto:/.test(u) && u.endsWith('.js'))
    .map(u => new URL(u, root).href);

// './state.js' inside js/main.js means js/state.js, so every import has to be
// resolved against the module that made it rather than against the site root.
const graph = new Set();
while (queued.length) {
    const url = queued.pop();
    if (graph.has(url)) continue;
    graph.add(url);
    for (const m of (await text(url)).matchAll(/\b(?:from|import)\s+['"](\.[^'"]+)['"]/g)) {
        queued.push(new URL(m[1], url).href);
    }
}
ok('the import graph was actually walked', graph.size >= 10, `${graph.size} modules`);

const notCached = [...graph].filter(url => !cached.has(url));
ok('every module the app loads is precached for offline use',
   notCached.length === 0, notCached.map(u => u.replace(root.href, '')).join(', '));

/* --- the status bar follows the theme ---

   hardcoded two different backgrounds would be testing a difference the
   design no longer has. What still has to hold is that the tag MOVES with the
   theme and that it lands on the dark shell, not a leftover light one. */

    document.documentElement.setAttribute('data-theme', theme);
    return getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();

   themeColor.getAttribute('content') === nightBg && !!nightBg, themeColor.getAttribute('content'));

   themeColor.getAttribute('content') === standardBg && !!standardBg,

   .every(t => { const c = bgOf(t); return /^#([0-9a-f])\1([0-9a-f])\2([0-9a-f])\3$/i.test(c)
                 || (parseInt(c.slice(1, 3), 16) + parseInt(c.slice(3, 5), 16)
                     + parseInt(c.slice(5, 7), 16)) / 3 < 80; }),

/* ============================ i18n ============================ */
// A translation layer is only trustworthy if it cannot be quietly wrong. The
// checks below are the canaries: dictionary parity (a missing key would ship
// English words in the middle of a Spanish screen), the resolution of every
// data-i18n key the real index.html carries, and the fact that a language
// switch actually redraws a real screen.
const isPlural = (v) => v !== null && typeof v === 'object'
    && typeof v.one === 'string' && typeof v.other === 'string';
const flat = (o, pfx = '') => Object.entries(o).flatMap(([k, v]) =>
    (v && typeof v === 'object' && !Array.isArray(v) && !isPlural(v))
        ? flat(v, pfx + k + '.') : [pfx + k]);
const enKeys = flat(en).sort();
const esKeys = flat(es).sort();

ok('every English key has a Spanish one',
   enKeys.filter(k => !esKeys.includes(k)).join(',') === '',
   enKeys.filter(k => !esKeys.includes(k)).join(', '));
ok('and no Spanish key is orphaned',
   esKeys.filter(k => !enKeys.includes(k)).join(',') === '',
   esKeys.filter(k => !enKeys.includes(k)).join(', '));
ok('the dictionary is substantial', enKeys.length > 200, `${enKeys.length} keys`);

// A plural entry missing half its forms would render a raw object.
const valueOf = (key) => { let n = en; for (const part of key.split('.')) n = n[part]; return n; };
const brokenPlural = enKeys.filter((k) => {
    if (!isPlural(valueOf(k))) return false;
    const node = valueOf(k);
    return typeof node.one !== 'string' || typeof node.other !== 'string';
});
ok('every plural entry has both forms', brokenPlural.length === 0, brokenPlural.join(', '));

// A {hole} that no call site ever fills renders as literal "{bank}" text in
// the middle of a button, and nothing about that looks like a bug on screen.
// So: collect every hole in the dictionary, collect every argument name passed
// at every t() call site in the app, and require that each hole is supplied
// somewhere. It is the inverse of the usual check and catches the case that
// actually reaches a user.
const holesOf = (k) => {
    const node = valueOf(k);
    const texts = isPlural(node) ? [node.one, node.other] : [node];
    return [...new Set(texts.flatMap((v) => (String(v).match(/\{(\w+)\}/g) || []).map((h) => h.slice(1, -1))))];
};
const sources = (await Promise.all(
    [...graph].map((u) => text(u).catch(() => ''))
)).join('\n');
// Walking to the matching close paren rather than to the next ")" matters:
// `t('preset.describe', { type: preset.type.toUpperCase(), ... })` has a ")"
// inside its own argument object, and a naive scan would stop there and decide
// the last two placeholders were never filled.
const supplied = new Map();   // key -> set of arg names seen at a call site
for (const call of sources.matchAll(/\bt\(\s*['"]([\w.]+)['"]/g)) {
    let depth = 1;
    let i = call.index + call[0].length;
    const from = i;
    while (i < sources.length && depth > 0) {
        const c = sources[i];
        if (c === '(') depth++;
        else if (c === ')') depth--;
        i++;
    }
    if (!supplied.has(call[1])) supplied.set(call[1], new Set());
    // both `name: value` and the shorthand `{ name }` count as supplying it
    for (const a of sources.slice(from, i).matchAll(/(\w+)\s*[:,}]/g)) {
        supplied.get(call[1]).add(a[1]);
    }
}
const unfilled = enKeys.filter((k) => holesOf(k).some((h) => !(supplied.get(k) || new Set()).has(h)));
ok('every {placeholder} in the dictionary is filled at a call site', unfilled.length === 0, unfilled.join(', '));
// And the other direction: a call site naming a key the dictionary lacks would
// already have warned, but silence is easy to miss, so assert it loudly.
const called = [...supplied.keys()].filter(k => !enKeys.includes(k));
ok('no call site asks for a key that does not exist', called.length === 0, called.join(', '));
ok('the placeholder check actually looked at the app', supplied.size > 100, `${supplied.size} call sites`);

/* --- t() itself --- */
eq('t() returns the English string', t('toast.drillDeleted'), 'Drill Deleted');
eq('t() interpolates a parameter', t('toast.bankFull', { bank: 'C' }), 'Bank C is full!');
eq('t() picks the singular for n=1', t('unit.countBalls', { n: 1 }), '1 ball');
eq('t() picks the plural for n=3', t('unit.countBalls', { n: 3 }), '3 balls');
eq('t() treats 0 as plural', t('unit.countDrills', { n: 0 }), '0 drills');
eq('t() leaves an unfilled hole alone rather than printing undefined',
   t('toast.savedTo'), 'Saved to {bank}');
eq('a key in no dictionary comes back as itself, not as undefined',
   t('no.such.key'), 'no.such.key');
ok('t() survives a junk key', (() => { try { t(null); t(''); t(undefined); return true; } catch (e) { return false; } })());

/* --- the real index.html, every key it references --- */
const markupKeys = [
    ...[...indexHtml.matchAll(/data-i18n="([^"]+)"/g)].map(m => m[1]),
    ...[...indexHtml.matchAll(/data-i18n-attr="([^"]+)"/g)]
        .flatMap(m => m[1].split(';').map(p => p.split(':')[1]).filter(Boolean))
];
ok('index.html actually uses the i18n attributes', markupKeys.length > 40, `${markupKeys.length} keys`);
const unknown = markupKeys.filter(k => !enKeys.includes(k));
ok('every data-i18n key in index.html resolves', unknown.length === 0, unknown.join(', '));
ok('and every one of them has a translation', markupKeys.filter(k => !esKeys.includes(k)).join(',') === '',
   markupKeys.filter(k => !esKeys.includes(k)).join(', '));

/* --- applyI18n: text, attributes and the one markup case --- */
setLang('es');
const frag = document.createElement('div');
frag.innerHTML = `<span data-i18n="menu.settings"></span>
                  <input data-i18n-attr="placeholder:placeholder.presetName;aria-label:a11y.backToDrills">
                  <div data-i18n-html="settings.installUnsupported"></div>`;
applyI18n(frag);
eq('applyI18n rewrites text', frag.querySelector('span').textContent, 'Ajustes');
eq('applyI18n rewrites the first attribute', frag.querySelector('input').getAttribute('placeholder'), 'Nombre del preset');
eq('applyI18n rewrites every attribute in the list', frag.querySelector('input').getAttribute('aria-label'), 'Volver a los ejercicios');
ok('applyI18n keeps markup in a data-i18n-html node', /→/.test(frag.lastElementChild.innerHTML),
   frag.lastElementChild.innerHTML);
setLang('en');

/* --- language state --- */
eq('setLang() records the choice', (setLang('es'), getLang()), 'es');
eq('and sets the document language', document.documentElement.getAttribute('lang'), 'es');
eq('and persists it', localStorage.getItem('nova_lang'), 'es');
ok('an unsupported language is refused', (setLang('fr'), getLang()) === 'es');
ok('setLang() announces itself so open screens can redraw', (() => {
    let fired = null;
    const on = (e) => { fired = e.detail.lang; };
    document.addEventListener('locale-changed', on);
    setLang('en');
    document.removeEventListener('locale-changed', on);
    return fired === 'en';
})());
ok('a stored choice survives a restart', (() => {
    localStorage.setItem('nova_lang', 'es');
    return initI18n() === 'es' && document.documentElement.getAttribute('lang') === 'es';
})());
ok('detection fills in on a first visit with no stored choice', (() => {
    localStorage.removeItem('nova_lang');
    const real = navigator.languages;
    Object.defineProperty(navigator, 'languages', { value: ['es-ES', 'en'], configurable: true });
    const picked = initI18n();
    Object.defineProperty(navigator, 'languages', { value: real, configurable: true });
    return picked === 'es';
})());
ok('an unrecognised browser language falls back to English', (() => {
    localStorage.removeItem('nova_lang');
    const real = navigator.languages;
    Object.defineProperty(navigator, 'languages', { value: ['ja-JP'], configurable: true });
    const picked = initI18n();
    Object.defineProperty(navigator, 'languages', { value: real, configurable: true });
    return picked === 'en';
})());
ok('a stored choice beats the browser preference', (() => {
    localStorage.setItem('nova_lang', 'en');
    const real = navigator.languages;
    Object.defineProperty(navigator, 'languages', { value: ['es-MX'], configurable: true });
    const picked = initI18n();
    Object.defineProperty(navigator, 'languages', { value: real, configurable: true });
    return picked === 'en';
})());
localStorage.removeItem('nova_lang');
initI18n();
setLang('en');

/* --- drill names: the keys are storage, only the labels move --- */
const factoryKeys = ['basic', 'combined', 'complex'].flatMap(c => CATEGORIES[c]);
const oldDrillLabel = (key) => key.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
ok('English drill names are byte-for-byte what they always were',
   factoryKeys.every(k => drillDisplayName(k) === oldDrillLabel(k)),
   factoryKeys.filter(k => drillDisplayName(k) !== oldDrillLabel(k)).join(', '));
setLang('es');
const spanish = factoryKeys.map(k => drillDisplayName(k));
ok('every factory drill is actually translated',
   factoryKeys.every((k, i) => spanish[i] !== oldDrillLabel(k)),
   factoryKeys.filter((k, i) => spanish[i] === oldDrillLabel(k)).join(', '));
eq('a backhand push reads as a Spanish label', drillDisplayName('push(b)'), 'Saque(Rev.)');
eq('a combined drill keeps its order', drillDisplayName('loop(f)-drive(b)'), 'Loop(Der.) · Golpe(Rev.)');
eq('a numbered random drill keeps its number', drillDisplayName('23-random-drive'), '23 Aleatorio · Golpe');
setLang('en');
eq('a custom drill key is left exactly as stored',
   drillDisplayName('cust_A_My_Drill_1712345'), 'cust_A_My_Drill_1712345');
eq('an unrecognised key still falls back to the old title-cased form',
   drillDisplayName('some-imported-key'), 'Some Imported Key');

/* --- preset axis labels: translated on the way out, not on the way in --- */
eq('a built-in axis label is translated', axisLabel('BH'), 'BH');
setLang('es');
eq('in the other language too', axisLabel('Center'), 'Centro');
eq('and the depth labels', axisLabel('Long'), 'Largo');
eq('a label the user typed passes through untouched', axisLabel('My spot'), 'My spot');
eq('an empty label is not turned into a word', axisLabel(''), '');
setLang('en');
// The generator must keep writing the canonical English labels, because they
// are stored inside the preset and round-trip through the export files.
ok('presets still store canonical English axis labels', (() => {
    const placements = P.standardPlacements(0).map(p => p.label);
    const depths = P.standardDepths(50).map(d => d.label);
    return JSON.stringify(placements) === JSON.stringify(['BH', 'Center', 'FH'])
        && JSON.stringify(depths) === JSON.stringify(['Short', 'Mid', 'Long']);
})(), JSON.stringify(P.standardPlacements(0).map(p => p.label)));
ok('the shipped preset library keeps its English names', P.DEFAULT_PRESETS[0].name === 'Short under serve',
   P.DEFAULT_PRESETS[0].name);

/* --- the switch actually redraws a real screen --- */
window.openSettings();          // the locale listener only fires when it is open
ok('the language row exists in Settings',
   !!document.querySelector('#settings-body [data-row="language"]'));
ok('and offers every shipped language, in its own language',
   [...document.querySelectorAll('#settings-body [data-lang-switch] .mode-option')]
       .map(e => e.textContent).join('|') === LANGUAGES.map(l => l.label).join('|'));
// A language picker nobody can hit with a thumb is not a picker. The existing
// 40px check only sees <button>, and this is a <div> like the reps/time switch.
const langOpts = [...document.querySelectorAll('#settings-body [data-lang-switch] .mode-option')];
ok('every language option is a usable tap target',
   langOpts.length > 0 && langOpts.every(e => e.getBoundingClientRect().height >= 40),
   langOpts.map(e => `${e.textContent} ${Math.round(e.getBoundingClientRect().height)}px`).join(', '));
ok('the language row does not squeeze its own description',
   (() => { const d = document.querySelector('#settings-body [data-row="language"] .settings-row-desc');
            return d && d.clientWidth > 120; })(),
   (() => { const d = document.querySelector('#settings-body [data-row="language"] .settings-row-desc');
            return d ? `${d.clientWidth}px` : 'no desc'; })());
window.handleSettingsLang('es');
const settingsText = document.getElementById('settings-body').textContent;
ok('switching to Spanish redraws Settings',
   /Apariencia/.test(settingsText) && /Idioma/.test(settingsText) && /Gestionar presets/.test(settingsText),
   cut(settingsText, 160));
ok('no English chrome is left behind in that screen',
   !/\bAppearance\b|\bManage presets\b|\bFactory reset\b|\bOffline use\b/.test(settingsText),
   cut(settingsText, 160));
ok('the active language is the one that was picked',
   /data-lang-switch[\s\S]*?mode-option active[^>]*>Español/.test(document.getElementById('settings-body').innerHTML));
ok('the language choice reached localStorage', localStorage.getItem('nova_lang') === 'es');
// and back again, so the checks above and below are not order-dependent
window.handleSettingsLang('en');
ok('and it switches back', /Appearance/.test(document.getElementById('settings-body').textContent));
window.closeSettings();

/* --- the editor redraws itself when the language changes --- */
setLang('es');
ok('an open editor is already in Spanish', (() => {
    openEditor('push(b)');
    const before = document.getElementById('editor-body').textContent;
    setLang('en');
    const after = document.getElementById('editor-body').textContent;
    closeEditor();
    return /Velocidad/.test(before) && /Speed/.test(after) && !/Velocidad/.test(after);
})());
ok('the editor labels are translated as well', (() => {
    setLang('es');
    openEditor('push(b)');
    const txt = document.getElementById('editor-body').textContent;
    closeEditor();
    return /Velocidad/.test(txt) && /Efecto/.test(txt) && !/\bSpeed\b/.test(txt);
})());

// Leave the app in English, which is what the rest of this page assumes.
localStorage.removeItem('nova_lang');
setLang('en');

/* ---- report ---- */
} catch (err) {
    results.push({ name: 'threw: ' + err.message, pass: false, extra: err.stack || '' });
}
report();
</script>
</body>
