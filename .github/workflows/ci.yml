name: Tests

# The gates, with no deploy. The site is served by Cloudflare Pages, which
# builds from the branch itself: no build command, output directory `v2/`.
#
# Keeping the gates is the reason this file still exists. Cloudflare will
# happily publish a branch that fails its tests, and nothing else in this
# repository would notice: no build step, no bundler, no test runner in
# production. What these two commands catch is the export-format regression,
# a half-translated dictionary, and a settings group that renders empty -
# none of which breaks a page load, so none of which anything else would see.
#
# The `site` job is the check that used to need a copy script. v2/ IS the
# published artifact, so "is it complete?" is a question about a directory
# rather than about a list somebody has to remember to update. See AGENTS.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel is safe here, unlike on a deploy: a run that is superseded by a newer
# push has nothing to leave half-finished in the live site.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Every *.test.mjs, not a named list: a new suite that nobody added to
      # this line would sit in the repo passing on its own machine and never
      # run here. The browser checks below are the other half of the gate.
      - name: Unit tests
        run: node --test tests/*.test.mjs

      # The browser suite drives the real editor, importer, exporter and
      # settings screen in headless Chrome, which the runner already has.
      - name: Browser integration checks
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null || {
            echo "::error::google-chrome is not on this runner - drop this step or install a browser"; exit 1; }

          python3 -m http.server 8123 --bind 127.0.0.1 >/dev/null 2>&1 &
          SERVER_PID=$!

          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8123/ && break
            sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:8123/ || { echo "::error::server never came up"; exit 1; }

          # A throwaway profile every run: the page writes to localStorage, so
          # a warm one starts from the previous run's drills and fails checks
          # that have nothing to do with the change under test.
          PROFILE=$(mktemp -d)
          trap 'rm -rf "$PROFILE"; kill $SERVER_PID 2>/dev/null || true' EXIT

          RESULT=$(google-chrome --headless --no-sandbox --disable-gpu \
                    --disable-dev-shm-usage --disable-crash-reporter \
                    --no-first-run --window-size=430,932 \
                    --user-data-dir="$PROFILE" \
                    --virtual-time-budget=20000 \
                    --dump-dom http://127.0.0.1:8123/tests/integration.html \
                    | grep -o '<title>[^<]*' || true)
          echo "$RESULT"
          case "$RESULT" in
            '<title>PASS('*) ;;
            *) echo "::error::integration checks did not pass"; exit 1 ;;
          esac

  site:
    name: Check the published tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # There is no copy step, so "what ships" is whatever is in v2/. These two
      # checks are the ones the copy script used to run against its output,
      # pointed at the directory itself. Both name the offending file and exit
      # non-zero, so an incomplete shell fails the build instead of shipping a
      # site that opens fine online and dies the first time it is offline.
      - name: Every local reference in v2/index.html resolves inside v2/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, sys
          site = pathlib.Path('v2')
          missing = []
          for ref in re.findall(r'(?:src|href)="([^"]+)"', (site / 'index.html').read_text()):
              if ref.startswith(('http://', 'https://', '//', '#', 'data:', 'mailto:')):
                  continue
              ref = ref.split('#')[0].split('?')[0]
              if not ref or ref.startswith('/'):
                  continue
              if not (site / ref).exists():
                  missing.append(ref)
          if missing:
              sys.exit('::error::v2/index.html references files that are not there: ' + ', '.join(missing))
          print('v2/index.html: every local asset is present')
          PY

      # An app that ships a worker pointing at a file nobody added opens fine
      # online and dies the first time it is offline, which is most of what the
      # PWA is for. The browser suite walks the real import graph, but against
      # the checkout; this asks the same question of v2/ itself.
      - name: Every file the service worker precaches is in v2/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, sys
          site = pathlib.Path('v2')
          source = (site / 'sw.js').read_text()
          body = re.search(r'const PRECACHE = \[(.*?)\];', source, re.S)
          if not body:
              sys.exit('::error::could not find the PRECACHE list in v2/sw.js')
          # Comments are stripped before the string literals are read. An
          # apostrophe in a comment - "signing you in", say - is not a path,
          # and reading it as one turns this job into a deploy blocker for
          # nothing. The list is prose-adjacent by design; it explains itself.
          listing = re.sub(r'//[^\n]*', '', body.group(1))
          entries = re.findall(r"'([^']+)'", listing)
          missing = [e for e in entries if e != 'SHELL' and not (site / e).exists()]
          if missing:
              sys.exit('::error::v2/sw.js precaches files that are not there: ' + ', '.join(missing))
          print(f'v2/sw.js: all {len(entries) - 1} precached files are present')
          PY

      # sw.js and the manifest are not optional extras: without them the site
      # works in a tab but can never be installed and never opens offline.
      # icons/ and fonts/ are precached too - a self-hosted webfont that is not
      # there falls back to the system stack the first time the phone is out of
      # signal - so the check is on the FILES, not the directories.
      - name: The files that must ship, ship
        run: |
          set -euo pipefail
          for required in index.html converter.html sw.js manifest.webmanifest \
                          fonts/dm-sans-latin.woff2 icons/icon-192.png icons/icon-512.png; do
            test -f "v2/$required" || { echo "::error::not published: v2/$required" >&2; exit 1; }
          done
          echo "all required files are in v2/"

      - name: List what will be published
        run: find v2 -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: v2
          retention-days: 7
